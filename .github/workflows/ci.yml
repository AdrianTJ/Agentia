name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runner: the app layer needs AppKit/WebKit, and the browser suite
    # drives agentia-render-cli from .build/debug.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/webtest/package-lock.json

      - name: Build and run the Swift suite
        run: |
          swift build
          swift test

      - name: Diff reference vectors
        run: python3 tools/verify-diff-vectors.py

      - name: Browser suite (real Chromium against the real renderer)
        working-directory: tools/webtest
        run: |
          npm ci
          npx playwright install chromium
          node run-tests.mjs
